<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ManchemTrade FINAL</title><style>:root{--bg:#0f1117;--card:#1a1d27;--card2:#212636;--border:#2a2f42;--text:#e4e6eb;--muted:#9aa0b3;--green:#00d084;--red:#ff4757;--yellow:#ffa502;--blue:#4f8bff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 ui-monospace,Menlo,monospace}header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border);background:#0d0f16}.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid}.b-mock{background:#0d2316;color:var(--green);border-color:#1e4d2b}.b-bal{background:#0d2316;color:var(--green);border-color:#1e4d2b}main{max-width:1280px;margin:0 auto;padding:16px;display:grid;gap:16px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}@media(max-width:980px){.grid{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}input,select,button{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;font:inherit}button{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;cursor:pointer}input{width:100px}select{width:150px}table{width:100%;border-collapse:collapse}th{color:var(--muted);font-size:11px;text-transform:uppercase;padding:6px;border-bottom:1px solid var(--border);text-align:left}td{padding:5px 6px;border-bottom:1px solid #1e2232;font-size:12px}canvas{width:100%;background:#0d0f16;border:1px solid var(--border);border-radius:10px;display:block}.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi div{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-width:110px}.kpi b{display:block;color:var(--muted);font-size:11px}.kpi span{font-weight:700}</style></head><body><header><div><b>MANCHEMTRADE</b> v3.8.5 FINAL • P&L Visual</div><div style="display:flex;gap:8px"><span class="badge b-mock" id="dryBadge">DRY_RUN=true • SPX mock</span><span class="badge b-bal" id="balBadge">IC: Balanced ✅ (10/10)</span></div></header><main><div class="grid"><div class="card"><div style="color:#9aa0b3;font-size:11px;margin-bottom:8px">CHAIN • SPX • NEVER UNDEFINED ✅</div><div class="row"><input id="ticker" value="SPX"><button id="fetchBtn">Fetch Chain</button><select id="strat"><option value="iron_condor" selected>Iron Condor</option><option value="call_credit">Call Credit</option><option value="put_credit">Put Credit</option></select><label><input type="checkbox" id="dry" checked style="width:auto">DRY_RUN</label></div><div style="max-height:260px;overflow:auto;border:1px solid #2a2f42;border-radius:8px"><table><thead><tr><th>STRIKE</th><th>BID</th><th>ASK</th><th>MID</th><th>TYPE</th></tr></thead><tbody id="chainBody"></tbody></table></div></div><div class="card"><div style="color:#9aa0b3;font-size:11px;margin-bottom:8px">P&L CONTROLS • WIDTH + CREDIT CHECK</div><div class="row"><label>Call Short <input id="cs" type="number" value="5520"></label><label>Long <input id="cl" type="number" value="5530"></label></div><div class="row"><label>Put Short <input id="ps" type="number" value="5480"></label><label>Long <input id="pl" type="number" value="5470"></label></div><div class="row"><label>Credit <input id="credit" type="number" value="2.5" step="0.1"></label><label>MaxWidth <input id="mwidth" readonly></label><button id="calcBtn">Calc P&L</button></div><div class="kpi"><div><b>Max Gain</b><span id="kGain">$0</span></div><div><b>Max Loss</b><span id="kLoss">$0</span></div><div><b>BE</b><span id="kBE">-</span></div><div><b>Status</b><span id="kStatus">-</span></div></div></div></div><div class="card"><div style="color:#9aa0b3;font-size:11px;margin-bottom:8px">P&L CHART • 51 POINTS • FINAL FIX</div><canvas id="c" width="1200" height="420"></canvas></div></main><script>
function mockChain(ticker){const base=5500,rows=[];for(let i=-10;i<=10;i++){const strike=base+i*10,bid=+(2+Math.abs(i)*0.7+Math.random()*0.5).toFixed(2),ask=+(bid+0.3).toFixed(2),mid=+((bid+ask)/2).toFixed(2);rows.push({strike,bid,ask,mid,type:i<0?'PUT':i>0?'CALL':'ATM'})}return rows}
function renderChain(rows){const tb=document.getElementById('chainBody');tb.innerHTML='';rows.forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${r.strike}</td><td style="color:#00d084">${r.bid}</td><td style="color:#ffa502">${r.ask}</td><td style="color:#4f8bff">${r.mid}</td><td>${r.type}</td>`;tb.appendChild(tr)})}
function calc(){const cs=+document.getElementById('cs').value,cl=+document.getElementById('cl').value,ps=+document.getElementById('ps').value,pl=+document.getElementById('pl').value,credit=+document.getElementById('credit').value,strat=document.getElementById('strat').value;let wCall=Math.abs(cl-cs),wPut=Math.abs(ps-pl),maxW=strat==='iron_condor'?Math.max(wCall,wPut):strat==='call_credit'?wCall:wPut;document.getElementById('mwidth').value=maxW;const bal=document.getElementById('balBadge');if(strat==='iron_condor'){const isBal=Math.abs(wCall-wPut)<=5;bal.textContent=isBal?`IC: Balanced ✅ (${wCall}/${wPut})`:`IC: Unbalanced ⚠️ (${wCall}/${wPut})`}if(credit>maxW){document.getElementById('kStatus').textContent=`Credit ${credit} > width ${maxW} - REJECTED`;document.getElementById('kStatus').style.color='#ff4757';draw([],[],0,0,0,0);return}const maxGain=credit,maxLoss=maxW-credit;document.getElementById('kGain').textContent=`$${maxGain.toFixed(2)}`;document.getElementById('kLoss').textContent=`-$${maxLoss.toFixed(2)}`;let bes=[];if(strat==='call_credit'||strat==='iron_condor')bes.push(cs+credit);if(strat==='put_credit'||strat==='iron_condor')bes.push(ps-credit);document.getElementById('kBE').textContent=bes.map(b=>b.toFixed(1)).join(' / ');document.getElementById('kStatus').textContent='OK - 51 points';document.getElementById('kStatus').style.color='#00d084';const center=strat==='iron_condor'?(cs+ps)/2:strat==='call_credit'?cs:ps,range=maxW*10,minX=center-range/2,maxX=center+range/2,pts=[];for(let i=0;i<51;i++){const price=minX+(maxX-minX)*i/50;let pnl;if(strat==='call_credit'){if(price<=cs)pnl=maxGain;else if(price>=cl)pnl=-maxLoss;else pnl=maxGain-(price-cs)}else if(strat==='put_credit'){if(price>=ps)pnl=maxGain;else if(price<=pl)pnl=-maxLoss;else pnl=maxGain-(ps-price)}else{let cP,pP;if(price<=cs)cP=maxGain/2;else if(price>=cl)cP=-maxLoss/2;else cP=maxGain/2-(price-cs)/2;if(price>=ps)pP=maxGain/2;else if(price<=pl)pP=-maxLoss/2;else pP=maxGain/2-(ps-price)/2;pnl=cP+pP}pts.push({price,pnl})}draw(pts,bes,maxGain,maxLoss,minX,maxX)}
function draw(pts,bes,maxGain,maxLoss,minX,maxX){const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,pad={l:60,r:20,t:30,b:35};ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d0f16';ctx.fillRect(0,0,W,H);if(!pts.length){ctx.fillStyle='#9aa0b3';ctx.fillText('Click Calc P&L',pad.l,H/2);return}const minP=Math.min(...pts.map(p=>p.pnl),-maxLoss)-1,maxP=Math.max(...pts.map(p=>p.pnl),maxGain)+1,xmap=x=>pad.l+(x-minX)/(maxX-minX)*(W-pad.l-pad.r),ymap=y=>pad.t+(maxP-y)/(maxP-minP)*(H-pad.t-pad.b);ctx.strokeStyle='#1e2232';for(let i=0;i<=4;i++){const y=pad.t+i/4*(H-pad.t-pad.b);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke()}const y0=ymap(0);ctx.strokeStyle='#2a2f42';ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(pad.l,y0);ctx.lineTo(W-pad.r,y0);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(xmap(pts[0].price),y0);pts.forEach(p=>ctx.lineTo(xmap(p.price),ymap(p.pnl)));ctx.lineTo(xmap(pts[pts.length-1].price),y0);ctx.closePath();const grad=ctx.createLinearGradient(0,pad.t,0,H-pad.b);grad.addColorStop(0,'rgba(0,208,132,0.25)');grad.addColorStop(0.5,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(255,71,87,0.22)');ctx.fillStyle=grad;ctx.fill();ctx.strokeStyle='#4f8bff';ctx.lineWidth=2.5;ctx.beginPath();pts.forEach((p,i)=>{const X=xmap(p.price),Y=ymap(p.pnl);if(i===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y)});ctx.stroke();bes.forEach(be=>{const X=xmap(be);ctx.strokeStyle='#ffa502';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(X,pad.t);ctx.lineTo(X,H-pad.b);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffa502';ctx.fillText(`BE ${be.toFixed(1)}`,X+4,pad.t+12)});ctx.fillStyle='#9aa0b3';ctx.font='11px monospace';ctx.fillText(`$${minX.toFixed(0)}`,pad.l,H-8);ctx.fillText(`$${maxX.toFixed(0)}`,W-pad.r-35,H-8);ctx.fillText(`Gain $${maxGain.toFixed(2)}`,pad.l,pad.t+12);ctx.fillText(`Loss -$${maxLoss.toFixed(2)}`,pad.l,H-pad.b-6)}
document.getElementById('fetchBtn').addEventListener('click',()=>{renderChain(mockChain('SPX'));calc()});document.getElementById('calcBtn').addEventListener('click',calc);window.addEventListener('load',()=>{renderChain(mockChain('SPX'));calc()});
</script></body></html>
